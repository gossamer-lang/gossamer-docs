site_name: Gossamer
site_url: https://gossamer-lang.org/docs/
site_description: A fast-compiling language with Rust-flavoured syntax and automatic, pause-free memory management.
site_author: Gossamer contributors
repo_url: https://github.com/gossamer-lang/gossamer
repo_name: gossamer-lang/gossamer
# `edit_uri` intentionally unset - the Material theme already surfaces
# the repository via the top-right repo link injected from `repo_url`.
edit_uri: ""

docs_dir: docs
site_dir: site/docs

theme:
  name: material
  logo: img/GossamerLogo.png
  favicon: img/GossamerLogo.png
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - js/repo_button.js
  - js/scroll_top.js
  - js/hljs_gossamer.js

hooks:
  - mkdocs_hooks.py

nav:
  - Home: index.md
  - Install: install.md
  - Running: running.md
  - Debugging: debugging.md
  - Supported targets: supported_targets.md
  - WebAssembly: wasm.md
  - Syntax: syntax.md
  - Collection literals: collection_literals.md
  - Language:
      - language/index.md
      - Top-level statements: language/top_level_statements.md
      - Arena blocks: language/arena.md
      - Built-in traits: language/builtin_traits.md
      - Cohorts: language/cohort.md
      - Comptime: language/comptime.md
      - Keyword arguments: language/keyword_arguments.md
      - Opaque nominal aliases: language/opaque_nominal_alias.md
      - Interpolated strings: language/interpolated_string.md
      - Triple-quoted strings: language/triple_quoted_string.md
      - Tuples: language/tuples.md
      - Foreign functions: language/unsafe_extern.md
  - Memory model: memory.md
  - Parallel collection adapters: parallel.md
  - Writing libraries: libraries.md
  - Calling Rust: rust_bindings.md
  - Standard library:
      - stdlib/index.md
      - Overview: stdlib.md
      - Prelude (no imports): prelude.md
      - Methods by type: method_support.md
      - Collection patterns: stdlib/collection_patterns.md
      - Coverage matrix: stdlib_coverage.md
  - Toolchain:
      - Overview: toolchain.md
      - Formatter behavior: misc/tooling_faithful_fmt.md
      - Lints: toolchain/lints.md
      - Diagnostics: toolchain/diagnostics.md
      - Building with Zig: toolchain/zig.md
  - Examples: examples.md
  - Production:
      - Deployment: deployment.md
      - Codegen ABI: codegen_abi.md
  - Migrating:
      - From Rust: migration/rust.md
      - From Go: migration/go.md
      - From Python: migration/python.md
      - From F#: migration/fsharp.md
      - From Kotlin: migration/kotlin.md
  - Design notes:
      - Sequence and reference safety: design/sequence_reference_safety.md
      - Diagnostics style: design/diagnostics.md
      - Standard library API: design/stdlib_api.md
      - Incremental front end: design/incremental.md
      - Package format: design/packages.md
      - Lazy iterators: design/lazy_iterators.md
      - Where semantics live: design/tiers.md
      - Runtime internals: design/runtime.md
      - JIT native-memory ownership: design/jit_native_memory_ownership.md
      - Memory model: design/memory_model.md
      - Goroutine stack model: design/goroutine_stacks.md
      - Self-hosting study: design/selfhosting.md
  - Ecosystem:
      - ecosystem/index.md
      - GUI libraries:
          - ecosystem/gui-libraries/index.md
          - Windowing:
              - ecosystem/windowing/index.md
              - Guide: ecosystem/windowing/guide.md
              - Platform capabilities: ecosystem/windowing/platform-capabilities.md
              - Testing: ecosystem/windowing/testing.md
          - GUI engine: ecosystem/gui-engine/index.md
          - GUI:
              - ecosystem/gui/index.md
              - Architecture: ecosystem/gui/architecture.md
              - Capabilities: ecosystem/gui/capabilities.md
              - Modules: ecosystem/gui/modules.md
              - Editing: ecosystem/gui/editing.md
              - Rich documents: ecosystem/gui/rich-documents.md
              - Documents: ecosystem/gui/documents.md
              - Completion: ecosystem/gui/completion.md
              - Theming: ecosystem/gui/theming.md
              - Localization: ecosystem/gui/localization.md
              - Keyboard: ecosystem/gui/keyboard.md
              - Accessibility: ecosystem/gui/accessibility.md
              - Custom widgets: ecosystem/gui/custom-widgets.md
              - Rendering: ecosystem/gui/rendering.md
              - Resources: ecosystem/gui/resources.md
              - Performance: ecosystem/gui/performance.md
              - Packaging: ecosystem/gui/packaging.md
              - Dependencies: ecosystem/gui/dependencies.md
              - Testing: ecosystem/gui/testing.md
              - Toolkit platform: ecosystem/gui/toolkit-platform.md
  - Compatibility: compatibility.md
  - Security: security.md
  - Contributing: contributing.md

# The per-module / per-keyword reference pages are generated by
# `gos doc --emit-stdlib`; they are reached through the in-nav index
# pages (stdlib/index.md, language/index.md) rather than listed
# individually, so the module list stays in sync with the generator.
not_in_nav: |
  /stdlib/*.md
  !/stdlib/index.md
  !/stdlib/collection_patterns.md
  /language/*.md
  !/language/index.md
  !/language/top_level_statements.md
  !/language/arena.md
  !/language/builtin_traits.md
  !/language/cohort.md
  !/language/comptime.md
  !/language/keyword_arguments.md
  !/language/opaque_nominal_alias.md
  !/language/interpolated_string.md
  !/language/triple_quoted_string.md
  !/language/tuples.md
  !/language/unsafe_extern.md

markdown_extensions:
  - admonition
  - footnotes
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - docs
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
